<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <title>Baget Gizlilik Politikası</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #182230;
      --muted: #526173;
      --line: #d9e2ef;
      --primary: #1565c0;
      --primary-soft: #e8f1fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    .hero {
      padding: 32px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0d1b2a, #1565c0);
      color: #ffffff;
      box-shadow: 0 18px 40px rgba(13, 27, 42, 0.18);
    }

    .hero p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.78);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.12;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.3;
      color: var(--text);
    }

    p {
      margin: 0 0 14px;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    section {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    ul {
      margin: 10px 0 0;
      padding-left: 22px;
    }

    li {
      margin: 6px 0;
    }

    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: #0d47a1;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
